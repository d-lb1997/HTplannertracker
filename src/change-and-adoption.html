<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HT Discovery: Change and Adoption plan and tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#eef1f7; --ink:#18202f; --muted:#525d78; --line:#d8deeb;
  --accent:#2e4e95; --accent-ink:#ffffff; --accent-soft:#e3e9f6; --red:#b22420; --red-soft:#f9e3e2;
  --done:#1b7a4f; --warn:#b22420; --warn-soft:#fbe9e8; --focus:#2e4e95;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{color-scheme:light}
}
:root[data-theme="dark"]{
  --bg:#0f1626; --surface:#172036; --surface2:#1f2a46; --ink:#e8ecf6; --muted:#9aa6c4; --line:#2a3552;
  --accent:#8ea8e8; --accent-ink:#0f1626; --accent-soft:#1f2d58; --red:#ff8782; --red-soft:#3b2023;
  --done:#4cc58c; --warn:#ff8782; --warn-soft:#3a2022; --focus:#b3c5f2; color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 80px}
header.top{padding:26px 0 8px;border-top:6px solid transparent;border-image:linear-gradient(90deg,var(--accent) 0 64%,var(--red) 64% 100%) 1}
header.top h1{font-size:clamp(1.55rem,3.4vw,2.15rem);line-height:1.15;margin:0 0 6px;font-weight:800;letter-spacing:-.015em}
header.top p{margin:0;color:var(--muted);max-width:68ch}
.overall{display:flex;gap:14px;align-items:center;margin:16px 0 4px;flex-wrap:wrap}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;flex:1;min-width:160px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.overall b{font-variant-numeric:tabular-nums}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 0;margin:0 -18px;padding-left:18px;padding-right:18px}
nav.tabs a{padding:8px 14px;border-radius:99px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
section.pane{display:none;padding-top:22px}
section.pane.on{display:block}
h2{font-size:1.35rem;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:1.05rem;margin:22px 0 8px}
.lede{color:var(--muted);margin:0 0 16px;max-width:70ch}
/* calendar strip */
.strip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto}
.srow{display:grid;grid-template-columns:96px repeat(5,minmax(74px,1fr));gap:6px;align-items:stretch;min-width:520px}
.srow+.srow{margin-top:6px}
.srow .wl{font-weight:700;font-size:.82rem;display:flex;flex-direction:column;justify-content:center;line-height:1.25}
.srow .wl span{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.shead{font-size:.74rem;color:var(--muted);text-align:center;font-weight:600}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 7px 7px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:3px;min-height:76px}
.day:hover{border-color:var(--accent)}
.day[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:0}
.day.xd{background:var(--accent-soft)}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day .dn{font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:baseline}
.day .dn small{font-weight:600;color:var(--muted);font-size:.68rem}
.day .ss{font-size:.68rem;line-height:1.2;color:var(--muted);flex:1}
.day.xd .ss{color:var(--ink)}
.day .mb{height:5px;border-radius:9px;background:var(--surface2);overflow:hidden}
.day .mb i{display:block;height:100%;background:var(--done);width:0}
.legend{font-size:.8rem;color:var(--muted);margin:8px 2px 0;display:flex;gap:14px;flex-wrap:wrap}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--accent-soft);border:1px solid var(--accent);vertical-align:-1px;margin-right:4px}
/* filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;font-size:.86rem;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:4px 6px;text-decoration:underline}
.next{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:14px 16px;margin:14px 0 6px}
.next h3{margin:0 0 6px}
/* tasks */
.wk{margin:26px 0 0}
.wk>h3{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 4px;font-size:1.1rem}
.wk>h3 span{font-size:.82rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.dayh{font-size:.86rem;font-weight:700;color:var(--muted);margin:14px 0 4px;display:flex;gap:8px;flex-wrap:wrap}
.dayh em{font-style:normal;font-weight:600;color:var(--ink);background:var(--accent-soft);border-radius:6px;padding:0 7px}
.task{display:flex;gap:11px;align-items:flex-start;padding:9px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);margin:0 0 6px}
.task input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--accent);cursor:pointer}
.task label{flex:1;cursor:pointer}
.task .tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:6px;vertical-align:1px;background:var(--surface2);color:var(--muted)}
.task .tag.cust{background:var(--red-soft);color:var(--red)}
.task .tag.ws{background:var(--accent-soft);color:var(--ink)}
.task .tag.signoff{background:var(--accent);color:var(--accent-ink)}
.task.done{background:var(--surface2)}
.task.done label span.tx{color:var(--muted)}
.task.done label span.tx{text-decoration:line-through}
.empty{color:var(--muted);padding:14px 4px}
/* generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tbl{overflow-x:auto;margin:8px 0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--surface2);font-size:.82rem;font-weight:700}
tr:last-child td{border-bottom:0}
td.t{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
details.pb{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 12px}
details.pb>summary{cursor:pointer;padding:14px 18px;font-weight:700;font-size:1.02rem;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.pb>summary::-webkit-details-marker{display:none}
details.pb>summary::after{content:"+";font-weight:800;color:var(--accent)}
details.pb[open]>summary::after{content:"\2212"}
details.pb .in{padding:0 18px 16px}
details.pb .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--muted);margin:0 0 8px}
ul.plain{margin:6px 0 10px;padding-left:20px}
ul.plain li{margin:3px 0}
.note{background:var(--warn-soft);border-left:5px solid var(--warn);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:.94rem}
.note b{color:var(--warn)}
.pill{display:inline-block;font-size:.76rem;font-weight:700;border-radius:99px;padding:1px 9px;background:var(--surface2)}
/* customization */
.dim{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.dim h4{margin:0 0 8px;font-size:.98rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:.88rem}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block;font-size:.8rem}
.result{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px 18px;margin:14px 0;border-bottom:5px solid var(--red)}
.result h3{margin:0 0 6px;color:var(--accent-ink)}
.meter{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;font-size:.84rem;margin:5px 0}
.meter .mt{height:8px;border-radius:9px;background:color-mix(in srgb,var(--accent-ink) 28%,transparent);overflow:hidden}
.meter .mt i{display:block;height:100%;background:var(--accent-ink)}
.cardrow{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.cardrow:last-child{border-bottom:0}
select{font:inherit;font-size:.86rem;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.tiers{display:inline-block;font-size:.72rem;font-weight:700;border-radius:6px;padding:0 6px;margin-left:6px;background:var(--surface2);color:var(--muted)}
.tiers.plus{background:var(--accent-soft);color:var(--accent)}
.tiers.pitch{background:var(--red-soft);color:var(--red)}
.mgroup{margin:0 0 18px}
.mgroup h3{margin:0 0 6px}
.resetrow{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.86rem}
@media (max-width:620px){
  .meter{grid-template-columns:110px 1fr 56px}
  .cardrow{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.tbl td.wrap, .tbl th.wrap{white-space:normal}
.logtbl input,.logtbl select{width:100%;min-width:90px;font:inherit;font-size:.86rem;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.logtbl td{padding:6px 8px}
.logtbl .del{white-space:nowrap}
.addrow{margin:0 0 18px}
.subtle{color:var(--muted);font-size:.9rem}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:8px 0 16px}
.kv .card{margin:0}
.kv .card h4{margin:0 0 6px;font-size:1rem}
.kv .card p,.kv .card ul{margin:0;font-size:.92rem;color:var(--muted)}
.kv .card ul{padding-left:18px}
</style>
</head>

feedback loops, dashboards and reporting, focus groups<\/td><\/tr><tr><td class='wrap'>Who<\/td><td class='wrap'>End users, key stakeholders, help desk, change champions, senior leaders<\/td><\/tr><tr><td class='wrap'>When<\/td><td class='wrap'>Baseline before go-live, after go-live, quarterly feedback<\/td><\/tr><tr><td class='wrap'>Why<\/td><td class='wrap'>Understand the response and adjust; keep users and organisation aligned<\/td><\/tr><\/tbody><\/table><\/div><p class='lede'>The pitch quoted 80%+ adoption within six months, +20% engagement and 15% fewer communication delays. Confirm with the sponsor which of these HT owns before they go into the roadmap.<\/p><h3>Champion role profile (draft to test in #15)<\/h3><div class='kv'><div class='card'><h4>Purpose<\/h4><ul><li>Peer voice and first line of support for the change<\/li><\/ul><\/div><div class='card'><h4>Responsibilities<\/h4><ul><li>Share news, collect feedback, help colleagues start, report issues<\/li><\/ul><\/div><div class='card'><h4>Selection<\/h4><ul><li>Across sites, shifts and languages; respected by peers; time released by line manager<\/li><\/ul><\/div><div class='card'><h4>To decide with HT<\/h4><ul><li>Time ask, nomination route, recognition, works council view<\/li><\/ul><\/div><\/div><h3>Narrative canvas (draft to test in #14)<\/h3><div class='tbl '><table><thead><tr><th class='wrap'>From<\/th><th class='wrap'>To<\/th><th class='wrap'>Proof points<\/th><\/tr><\/thead><tbody><tr><td class='wrap'>Information scattered, hard to find, and missing 2,000+ frontline colleagues<\/td><td class='wrap'>One place that connects people, tools and knowledge, reachable by every employee<\/td><td class='wrap'>[evidence from interviews, tests and discovery]<\/td><\/tr><\/tbody><\/table><\/div>"}]}, {"id": "materials", "label": "Materials", "title": "Materials and artefacts", "lede": "What to prepare and what to produce. Tick items as they are ready.", "blocks": [{"type": "checklist", "groups": [["Interviews CFG.tabs.forEach(function(tab){tab.blocks.forEach(function(b){if(b.type==="checklist")b.groups.forEach(function(g){g[1].forEach(function(x){IDS.push(x[0])})})})});
function updateOverall(){
  var n=0;IDS.forEach(function(id){if(S.done[id])n++});
  $("ovtxt").textContent=n+" of "+IDS.length;
  var pct=IDS.length?Math.round(100*n/IDS.length):0;$("ovfill").style.width=pct+"%";$("ovbar").setAttribute("aria-valuenow",pct);
}

/* ---------- tasks block ---------- */
function renderStrip(){
  var today=new Date().toISOString().slice(0,10), h='<div class="srow"><div></div>'+DOW.map(function(d){return '<div class="shead">'+d+'</div>'}).join("")+'</div>';
  WEEKS.forEach(function(w){
    var wt=0,wd=0;w.days.forEach(function(d){var c=countDay(d);wd+=c[0];wt+=c[1]});
    h+='<div class="srow"><div class="wl">'+esc(w.label)+'<span>'+wd+'/'+wt+' · '+esc(w.sub)+'</span></div>';
    w.days.forEach(function(d){
      var c=countDay(d),s=SESS[d]||["",0],l=dayLabel(d),pct=c[1]?Math.round(100*c[0]/c[1]):0;
      h+='<button type="button" class="day'+(s[1]?' xd':'')+(d===today?' today':'')+'" data-day="'+d+'" aria-pressed="'+(selDay===d)+'" aria-label="'+l.n+' '+l.m+', '+c[0]+' of '+c[1]+' tasks done"><span class="dn">'+l.n+'<small>'+l.m+'</small></span><span class="ss">'+esc(s[0])+'</span><span class="mb"><i style="width:'+pct+'%"></i></span></button>';
    });
    h+='</div>';
  });
  var el=$("strip");if(el)el.innerHTML=h;
}
function renderFilters(){
  var el=$("filters");if(!el)return;
  var f=[["all","All"],["open","Open"],["done","Done"]].concat(CFG.filters);
  var h=f.map(function(x){return '<button type="button" class="chip" data-f="'+x[0]+'" aria-pressed="'+(filt===x[0])+'">'+esc(x[1])+'</button>'}).join("");
  if(selDay){var l=dayLabel(selDay);h+='<button type="button" class="linkbtn" id="clrday">Showing '+l.n+' '+l.m+'. Show all days</button>'}
  el.innerHTML=h;
}
function taskHTML(x){
  var d=!!S.done[x[0]],tg=TAGS[x[2]]||[x[2],""];
  return '<div class="task'+(d?' done':'')+'"><input type="checkbox" id="'+x[0]+'" data-id="'+x[0]+'"'+(d?' checked':'')+'><label for="'+x[0]+'"><span class="tx">'+esc(x[3])+'</span><span class="tag '+tg[1]+'">'+esc(tg[0])+'</span></label>'+(window.HTDeps?HTDeps.html("ca",x[0]):"")+'</div>';
}
function renderTasks(){
  var el=$("tasklist");if(!el)return;
  var list=T.filter(function(x){
    if(selDay&&x[1]!==selDay)return false;
    if(filt==="open")return !S.done[x[0]];
    if(filt==="done")return !!S.done[x[0]];
    if(filt!=="all"&&x[2]!==filt)return false;
    return true;
  });
  if(!list.length){el.innerHTML='<div class="empty">No tasks match this filter.</div>';return}
  var h="",lastW="",lastD="";
  list.forEach(function(x){
    var w=weekOf(x[1]);
    if(w.k!==lastW){var wt=0,wd=0;T.forEach(function(y){if(weekOf(y[1]).k===w.k){wt++;if(S.done[y[0]])wd++}});h+='<div class="wk"><h3>'+esc(w.label)+': '+esc(w.sub)+'<span>'+wd+' of '+wt+' done</span></h3></div>';lastW=w.k;lastD=""}
    if(x[1]!==lastD){var di=dayIdx(x[1]),l=dayLabel(x[1]),s=SESS[x[1]];h+='<div class="dayh">'+DOW[di[1]]+' '+l.n+' '+l.m+(s&&s[0]?' <em>'+esc(s[0])+'</em>':'')+'</div>';lastD=x[1]}
    h+=taskHTML(x);
  });
  el.innerHTML=h;
}
function refreshTasks(){renderStrip();renderTasks();updateOverall()}

/* ---------- block renderers ---------- */
function blockHTML(b){
  if(b.type==="html")return (b.title?'<h3>'+esc(b.title)+'</h3>':'')+(b.lede?'<p class="lede">'+esc(b.lede)+'</p>':'')+b.html;
  if(b.type==="tasks")return '<p class="lede">'+esc(CFG.stripNote)+'</p><div class="strip" id="strip"></div><div class="legend"><span><i class="sw"></i>'+esc(CFG.ownerLabel)+'</span><span>Bar under each day shows tasks done</span></div><div class="filters" id="filters"></div><div id="tasklist"></div>';
  if(b.type==="checklist")return (b.title?'<h3>'+esc(b.title)+'</h3>':'')+(b.lede?'<p class="lede">'+esc(b.lede)+'</p>':'')+b.groups.map(function(g){return '<div class="mgroup"><h3>'+esc(g[0])+'</h3>'+g[1].map(function(x){var d=!!S.done[x[0]];return '<div class="task'+(d?' done':'')+'"><input type="checkbox" id="'+x[0]+'" data-id="'+x[0]+'"'+(d?' checked':'')+'><label for="'+x[0]+'"><span class="tx">'+esc(x[1])+'</span></label></div>'}).join("")+'</div>'}).join("");
  if(b.type==="scorecard"){
    var h=(b.title?'<h3>'+esc(b.title)+'</h3>':'')+(b.lede?'<p class="lede">'+esc(b.lede)+'</p>':'');
    b.factors.forEach(function(f,i){
      h+='<div class="dim"><h4>'+esc(f[0])+'</h4><div class="opts" role="radiogroup" aria-label="'+esc(f[0])+'">'+[1,2,3].map(function(k){return '<label class="opt"><input type="radio" name="'+b.id+'-'+i+'" value="'+k+'" data-sc="'+b.id+'|'+i+'"'+(S.sc[b.id+"|"+i]==k?' checked':'')+'><span><b>'+esc(b.levels[k-1])+'</b>'+esc(f[k])+'</span></label>'}).join("")+'</div></div>';
    });
    return h+'<div class="result" id="res-'+b.id+'"></div>';
  }
  if(b.type==="log")return logHTML(b);
  return "";
}
function scResult(b){
  var el=$("res-"+b.id);if(!el)return;
  var vals=b.factors.map(function(f,i){return +S.sc[b.id+"|"+i]||0}),n=vals.filter(Boolean).length;
  var h='<h3>'+esc(b.resultTitle||"Result")+'</h3>';
  if(!n){h+='<p style="margin:0">Choose the description that fits best for each factor.</p>'}
  else{
    var risk=[],part=[];vals.forEach(function(v,i){if(v===3)risk.push(b.factors[i][0]);else if(v===2)part.push(b.factors[i][0])});
    h+='<p style="margin:0 0 10px"><b>'+(vals.filter(function(v){return v===1}).length)+' ready, '+part.length+' partly ready, '+risk.length+' at risk</b> ('+n+' of '+b.factors.length+' rated).'+(risk.length?' Focus first: '+esc(risk.join(", "))+'.':(n===b.factors.length?' No factor is at risk.':''))+'</p>';
    b.factors.forEach(function(f,i){var v=vals[i];h+='<div class="meter"><span>'+esc(f[0])+'</span><span class="mt"><i style="width:'+(v?Math.round((4-v)/3*100):0)+'%"></i></span><span>'+(v?esc(b.levels[v-1]):"not rated")+'</span></div>'});
  }
  el.innerHTML=h;
}
function logRows(b){if(!S.logs[b.id])S.logs[b.id]=JSON.parse(JSON.stringify(b.seed||[]));return S.logs[b.id]}
function logHTML(b){
  var rows=logRows(b);
  var h=(b.title?'<h3>'+esc(b.title)+'</h3>':'')+(b.lede?'<p class="lede">'+esc(b.lede)+'</p>':'');
  h+='<div class="tbl logtbl"><table><thead><tr>'+b.columns.map(function(c){return '<th style="min-width:'+(c.w||110)+'px">'+esc(c.label)+'</th>'}).join("")+'<th></th></tr></thead><tbody id="log-'+b.id+'">'+rows.map(function(r,ri){return logRowHTML(b,r,ri)}).join("")+'</tbody></table></div>';
  h+='<div class="addrow"><button type="button" class="chip" data-addlog="'+b.id+'">Add a row</button></div>';
  return h;
}
function logRowHTML(b,r,ri){
  return '<tr>'+b.columns.map(function(c){
    var v=r[c.k]==null?"":r[c.k];
    if(c.type==="select")return '<td><select data-log="'+b.id+'|'+ri+'|'+c.k+'" aria-label="'+esc(c.label)+'">'+c.options.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>'}).join("")+'</select></td>';
    return '<td><input type="text" value="'+esc(v)+'" data-log="'+b.id+'|'+ri+'|'+c.k+'" aria-label="'+esc(c.label)+'"></td>';
  }).join("")+'<td class="del"><button type="button" class="linkbtn" data-dellog="'+b.id+'|'+ri+'">Delete</button></td></tr>';
}
function findBlock(id){var f=null;CFG.tabs.forEach(function(t){t.blocks.forEach(function(b){if(b.id===id)f=b})});return f}

/* ---------- build tabs ---------- */
function build(){
  $("h1").textContent=CFG.title;$("intro").textContent=CFG.intro;
  $("tabs").innerHTML=CFG.tabs.map(function(t){return '<a href="#'+t.id+'">'+esc(t.label)+'</a>'}).join("");
  $("panes").innerHTML=CFG.tabs.map(function(t){return '<section class="pane" id="p-'+t.id+'"><h2>'+esc(t.title)+'</h2>'+(t.lede?'<p class="lede">'+esc(t.lede)+'</p>':'')+t.blocks.map(blockHTML).join("")+'</section>'}).join("");
  CFG.tabs.forEach(function(t){t.blocks.forEach(function(b){if(b.type==="scorecard")scResult(b)})});
  renderFilters();refreshTasks();updateOverall();route();
}

/* ---------- events ---------- */
document.addEventListener("change",function(e){
  var t=e.target;if(!t.matches)return;
  if(t.matches("input[data-id]")){
    S.done[t.dataset.id]=t.checked;persist();
    var row=t.closest(".task");if(row)row.classList.toggle("done",t.checked);
    if($("strip")&&t.dataset.id.charAt(0)==="t"){renderStrip();renderTasks()}
    updateOverall();
  }else if(t.matches("input[data-sc]")){
    S.sc[t.dataset.sc]=t.value;persist();scResult(findBlock(t.dataset.sc.split("|")[0]));
  }else if(t.matches("select[data-log]")){
    var p=t.dataset.log.split("|");logRows(findBlock(p[0]))[+p[1]][p[2]]=t.value;persist();
  }
});
document.addEventListener("input",function(e){
  var t=e.target;if(t.matches&&t.matches("input[data-log]")){var p=t.dataset.log.split("|");logRows(findBlock(p[0]))[+p[1]][p[2]]=t.value;persist()}
});
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("button");if(!b)return;
  if(b.dataset.day){selDay=(selDay===b.dataset.day)?null:b.dataset.day;renderFilters();refreshTasks()}
  else if(b.dataset.f){filt=b.dataset.f;renderFilters();renderTasks()}
  else if(b.id==="clrday"){selDay=null;renderFilters();refreshTasks()}
  else if(b.dataset.addlog){var blk=findBlock(b.dataset.addlog),rows=logRows(blk),r={};blk.columns.forEach(function(c){r[c.k]=c.type==="select"?c.options[0]:""});rows.push(r);persist();$("log-"+blk.id).innerHTML=rows.map(function(x,i){return logRowHTML(blk,x,i)}).join("")}
  else if(b.dataset.dellog){var q=b.dataset.dellog.split("|"),bl=findBlock(q[0]),rs=logRows(bl);rs.splice(+q[1],1);persist();$("log-"+bl.id).innerHTML=rs.map(function(x,i){return logRowHTML(bl,x,i)}).join("")}
  else if(b.id==="resetbtn"){if(window.confirm("Clear all ticks, answers and log entries on this page?")){S={done:{},sc:{},logs:{}};persist();selDay=null;filt="all";build()}}
});

window.HTRoute=route;
window.HTRefresh=function(){if($("tasklist"))refreshTasks()};
window.HTFocus=function(id){
  selDay=null;filt="all";
  try{history.replaceState(null,"","#"+CFG.tabs[0].id)}catch(e){}
  route();renderFilters();refreshTasks();
  var i=document.querySelector('#tasklist input[data-id="'+id+'"]'),r=i&&i.closest(".task");
  if(r){r.scrollIntoView({block:"center"});r.classList.remove("flash");void r.offsetWidth;r.classList.add("flash")}
};
function route(){
  var names=CFG.tabs.map(function(t){return t.id}),h=(location.hash||"").replace("#","");
  if(names.indexOf(h)<0)h=names[0];
  names.forEach(function(n){$("p-"+n).classList.toggle("on",n===h)});
  var links=$("tabs").querySelectorAll("a");
  for(var i=0;i<links.length;i++){if(links[i].getAttribute("href")==="#"+h)links[i].setAttribute("aria-current","page");else links[i].removeAttribute("aria-current")}
}
window.addEventListener("hashchange",route);
build();
})();
</script>
</body>
</html>
